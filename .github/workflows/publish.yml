name: Publish scheduled Threads posts

on:
  schedule:
    # Jalan tiap 30 menit. Ubah angka ini kalau mau lebih sering/jarang.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # biar bisa di-trigger manual dari tab "Actions" buat testing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Publish due posts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python publish_threads.py
