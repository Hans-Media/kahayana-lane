name: One-off get long-lived token (with full scopes)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "OAuth 'code' param from the authorize URL redirect (must be used within a few minutes, it expires fast)"
        required: true
        type: string

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Exchange code for long-lived token
        env:
          THREADS_APP_ID: ${{ vars.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_REDIRECT_URI: ${{ vars.THREADS_REDIRECT_URI }}
          OAUTH_CODE: ${{ inputs.code }}
        run: python get_long_lived_token.py
